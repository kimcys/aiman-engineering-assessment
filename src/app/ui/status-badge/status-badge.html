<span
  class="inline-flex shrink-0 items-center gap-[7px] rounded-full border px-2.5 py-1.5"
  [class]="
    tone() === 'accent'
      ? 'border-accent bg-accent-soft'
      : 'border-hairline bg-neutral-chip'
  "
>
  <span class="size-1.5 shrink-0 rounded-full bg-accent"></span>
  <span
    class="whitespace-nowrap text-[11px] font-bold uppercase"
    [class]="tone() === 'accent' ? 'text-accent' : 'text-ink'"
    >{{ label() }}</span
  >
</span>
