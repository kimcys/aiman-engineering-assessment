<div class="mx-auto flex max-w-[1296px] flex-col gap-10">
  <div class="flex flex-col gap-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <p class="text-[13px] font-bold text-accent">
          {{ index().toString().padStart(2, '0') }} / {{ total().toString().padStart(2, '0') }}
        </p>
        <p class="text-[11px] uppercase text-muted">{{ category() }}</p>
      </div>
      <div class="flex items-center gap-2.5">
        <p class="text-[11px] text-muted">EXPANDED</p>
        <app-icon name="minus" class="inline-flex shrink-0"></app-icon>
      </div>
    </div>
    <p class="max-w-[1050px] text-[26px] leading-[1.2] sm:text-[32px] lg:text-[38px]">
      {{ question() }}
    </p>
  </div>

  <ng-content></ng-content>
</div>
